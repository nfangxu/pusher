app:
  host: "0.0.0.0"
  port: 8080

log:
  level: "info"
  path: "logs/pusher.log"
  max_days: 7

sse:
  heartbeat_interval: 30
  read_timeout: 60
  cors_origins: "*"
  worker_num: 8
  push_queue_capacity: 10000
  shard_num: 32
  fan_out_workers: 200

token:
  salt: "dev-secret-salt-change-before-production"
  expire_seconds: 3600

push:
  token: "dev-push-token-change-before-production"
  rate_limit: 100
